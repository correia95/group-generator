      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Random Group Generator",
        "url": "https://group-generator.correia95.workers.dev/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Split a list of names into random, evenly-sized groups by group count or group size, using the browser's secure random generator."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I split a list of people into random groups?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Paste the names, one per line or comma-separated, choose how many groups you want (or how many people per group), and press Shuffle. The names are randomly shuffled and dealt out evenly."
            }
          },
          {
            "@type": "Question",
            "name": "Are the groups the same size?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "As close as possible. Names are dealt round-robin, so if the total doesn't divide evenly the groups differ by at most one person."
            }
          },
          {
            "@type": "Question",
            "name": "Is the shuffle actually random?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. It uses a Fisher-Yates shuffle with crypto.getRandomValues and rejection sampling, so there is no modulo bias and every arrangement is equally likely."
            }
          },
          {
            "@type": "Question",
            "name": "Can I share the list?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Copy a link to this list packs the names into the URL. The link restores the roster, not a particular split, so opening it and pressing Shuffle gives a fresh random grouping."
            }
          }
        ]
      }
    </script>
